[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optivedge"
version = "0.1.0"
description = "Reusable Django firewall integration framework"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "requests>=2.31",
    "xmltodict>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optivedge" = [
    "templates/**/*.html",
    "templates/**/*.svg",
    "static/**/*",
]
