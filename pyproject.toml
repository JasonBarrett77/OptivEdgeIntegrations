[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optivedge-integrations"
version = "0.1.0"
description = "Reusable Django firewall integration framework"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "requests>=2.31",
    "xmltodict>=0.13",
    # PAN-OS exposes a certificate's key SIZE and SIGNATURE algorithm in no configuration
    # field - `algorithm` reports RSA or EC, the key algorithm - and no operational command
    # carries them either. The only source is the X.509 blob PAN-OS stores under the
    # misleadingly named `public-key`, so PAN-CRT-002 and PAN-CRT-003 cannot be answered
    # without decoding it. This is the first dependency added to interpret a payload rather
    # than transport or parse one.
    "cryptography>=42",
    "optivedge @ git+https://github.com/JasonBarrett77/OptivEdge.git@main",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optivedge_integrations.integrations" = [
    "templates/**/*.html",
    "docs/**/*.md",
]

# Keep the wheel staging path short. Windows still caps a path at 260 characters
# unless long paths are enabled, and pip builds under
# %TEMP%\pip-install-xxxxxxxx\<project>_<32 hex>\ - a ~113 character root before
# this project contributes anything. The default staging leg,
# build\bdist.win-amd64\wheel\., spends 29 of the remainder for nothing; this
# spends 8. Measured 2026-09-23: it moved the worst path from 272 (which failed)
# to 235. See the migration renames in the same commit.
[tool.distutils.bdist_wheel]
bdist_dir = "build/w"
